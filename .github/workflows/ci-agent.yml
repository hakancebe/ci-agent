# CiAgent — CI kırıldığında otomatik hata analizi.
#
# ÖNEMLİ: Bu dosya, izlenen "CI" workflow'unun BULUNDUĞU repo'ya kurulmalıdır
# (yani hakancebe/ci-agent-pilot içindeki .github/workflows/ci-agent.yml).
# workflow_run tetikleyicisi yalnızca aynı repo içindeki workflow'ları izleyebilir.
# Agent'ın kendi kaynak kodu ayrı repo'da (hakancebe/ci-agent) olduğu için
# aşağıda checkout ile oradan çekiliyor. Bu haliyle dosya iki repo'da da aynıdır.

name: CI Agent

on:
  workflow_run:
    # Bu ad, ci.yml'deki `name: CI` ile birebir eşleşmek zorunda.
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read         # job listesi + job log indirme
  checks: read          # check-run annotation'ları
  contents: write       # commit yorumu (PR bulunamazsa fallback)
  issues: write         # PR yorumu (Issue Comment API)
  pull-requests: write  # commit -> PR eşleştirme + PR yorumu

jobs:
  analyze:
    # Sadece CI gerçekten patladıysa çalış.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Agent kaynak kodunu çek
        uses: actions/checkout@v4
        with:
          repository: hakancebe/ci-agent
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: CiAgent'ı çalıştır
        env:
          # CI_AGENT_PAT tanımlıysa o, değilse job'ın GITHUB_TOKEN'ı kullanılır.
          GITHUB_TOKEN: ${{ secrets.CI_AGENT_PAT || secrets.GITHUB_TOKEN }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          # Hedef: bu workflow'u tetikleyen, başarısız olan CI run'ı.
          CI_AGENT_OWNER: ${{ github.event.workflow_run.repository.owner.login }}
          CI_AGENT_REPO: ${{ github.event.workflow_run.repository.name }}
          CI_AGENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: dotnet run --project CiAgent.Cli/CiAgent.Cli.csproj -c Release
